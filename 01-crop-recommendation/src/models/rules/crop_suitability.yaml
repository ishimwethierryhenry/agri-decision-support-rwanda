# Expert-rules baseline (B1): crop suitability ranges, written as data.
#
# Every factor cites the literature notes in docs/baseline_research_notes.md (reference numbers [1] to [7]).
# Nothing here is tuned on our data. Status stays "draft" until a teammate checks each range against the source page.
#
# Scoring per factor:   inside "optimal" = 1.0, inside "tolerated" = 0.5, outside both = 0.0, value missing = skipped.
# A null bound means open (no limit on that side).
# Crop score = mean of the evaluated factor scores. Crops are ranked by score.
#
# Variables: elevation_m (point level, CIAT GPS); precip_mm (season B sum, district level, NASA POWER);
# tmean_point_c and tmin_point_c: NASA POWER district temperature moved to each point's height with the
# standard lapse rate of 6.5 C per 1000 m [8]. See evaluate.prepare() for the reference height assumption.
#
# [8] International Civil Aviation Organization, "Manual of the ICAO Standard Atmosphere," Doc 7488, 3rd ed., 1993.

version: "0.1-draft"
status: draft

crops:
  irish_potato:
    factors:
      - variable: elevation_m
        optimal: [1800, null]
        source: {ref: "[4]", text: "Potato is grown mainly above 1800 m in Rwanda."}
      - variable: tmean_point_c
        optimal: [16, 20]
        source: {ref: "[4]", text: "16 to 20 C cited as the national range for potato."}

  beans:
    factors:
      - variable: elevation_m
        optimal: [600, 1950]
        source: {ref: "[3]", text: "Dry common bean is grown at 600 to 1950 m in many tropical areas."}
      - variable: tmean_point_c
        optimal: [17.5, 27]
        source: {ref: "[3]", text: "Bean grows within 17.5 to 27 C."}
      - variable: precip_mm
        optimal: [300, null]
        source: {ref: "[3]", text: "Bean needs 300 to 400 mm per crop cycle."}
        assumption: "The source gives a need, not an upper limit, so only the lower bound is used."

  maize:
    factors:
      - variable: tmean_point_c
        optimal: [18, 33]
        tolerated: [10, 47]
        source: {ref: "[1]", text: "EcoCrop: optimal 18 to 33 C, absolute 10 to 47 C."}
      - variable: precip_mm
        optimal: [500, null]
        source: {ref: "[2]", text: "A medium-maturity grain crop needs 500 to 800 mm of water per cycle."}
        assumption: "The source gives a need for maximum production, not an upper limit, so only the lower bound is used."

  rice:
    factors:
      - variable: tmin_point_c
        optimal: [14, null]
        source: {ref: "[6]", text: "Minimum temperatures below 14 C during reproduction damaged rice."}
    reliability_cap: low
    note: "Rice depends mostly on marshland or irrigation, and the feature table has no water-access layer [5]."
